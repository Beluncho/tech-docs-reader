server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 100m;

    # types на уровне server ЗАМЕНЯЕТ наследуемую из http таблицу MIME-типов целиком
    # (из-за этого html отдавался как octet-stream и браузер предлагал сохранить файл) —
    # поэтому подключаем стандартный mime.types заново и рядом добавляем mjs (ES-модули,
    # fabric; в mime.types его нет). Блоки types на одном уровне объединяются.
    include /etc/nginx/mime.types;
    types {
        text/javascript mjs;
    }
    types_hash_max_size 2048;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
    }

    location ~* \.(?:html|js|css|svg|ico|png|jpg|woff2?)$ {
        expires -1;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}